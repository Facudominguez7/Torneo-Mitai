version: '3.8'

services:
  # Servicio de base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: mitai-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-mitai_testing}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mitai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # Servicio phpMyAdmin (Gestión visual de BD)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mitai-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    networks:
      - mitai-network
    depends_on:
      - mysql

  # Servicio de la aplicación PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitai-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - /var/www/html/vendor
    networks:
      - mitai-network
    depends_on:
      mysql:
        condition: service_healthy
    # APP_ENV y DB_DATABASE salen del .env montado; no se inyectan aca.
    # Inyectadas quedan en la superglobal SERVER, que Laravel resuelve
    # antes que putenv, anulando los <env> de phpunit.xml: los tests
    # corrian con APP_ENV=local y el CSRF activo devolvia 419.
    environment:
      - APP_DEBUG=${APP_DEBUG}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_TEST_DATABASE=${DB_TEST_DATABASE:-mitai_testing}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  # Scheduler: hace en local lo que el cron del hosting en producción (schedule:run cada minuto),
  # así la cola de los avisos se procesa igual en los dos entornos.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitai-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - /var/www/html/vendor
    networks:
      - mitai-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_DEBUG=${APP_DEBUG}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  # Servicio Nginx (servidor web)
  nginx:
    image: nginx:alpine
    container_name: mitai-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mitai-network
    depends_on:
      - app

  # Servicio Node para Vite (desarrollo frontend)
  vite:
    image: node:20-alpine
    container_name: mitai-vite
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    networks:
      - mitai-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Servicio Mailhog (servidor SMTP para desarrollo)
  # Interfaz web: http://localhost:8025
  # Puerto SMTP: 1025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mitai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # Puerto SMTP para envío de emails
      - "8025:8025"   # Interfaz web para ver emails capturados
    networks:
      - mitai-network

networks:
  mitai-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
