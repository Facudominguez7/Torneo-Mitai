name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a main
  workflow_dispatch:  # También permite ejecución manual desde GitHub

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          tools: composer:v2
          coverage: none
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist
        
      - name: Install NPM dependencies
        run: npm ci
        
      - name: Build assets
        run: |
          npm run build
          # Comprimir assets para evitar problemas de transferencia (archivos vacíos)
          tar -czf assets.tar.gz -C public build

      - name: Prepare & Update Code via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Stop script on first error
            set -e

            echo "Deploying to ${{ secrets.DEPLOY_PATH }}..."
            
            # Verificar que el directorio existe
            if [ ! -d "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "❌ Error: Directory ${{ secrets.DEPLOY_PATH }} does not exist."
              exit 1
            fi

            cd ${{ secrets.DEPLOY_PATH }}
            
            # Verificar si es un repo git, si no, inicializarlo (para la primera vez)
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository..."
              git init
              # USAR SSH CON ALIAS CONFIGURADO (github-torneo)
              git remote add origin git@github-torneo:${{ github.repository }}.git
              git fetch origin main
              git reset --soft origin/main
            else
              # Asegurar que el remote sea SSH con el alias correcto
              git remote set-url origin git@github-torneo:${{ github.repository }}.git
            fi
            
            # Activar modo mantenimiento
            php artisan down --retry=60 || true
            
            # Actualizar código
            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main
            
            # Eliminar archivos innecesarios para producción
            echo "Removing unnecessary files..."
            rm -rf docker-compose.yml docker-start.bat docker-start.sh DOCKER.md Dockerfile docker sync_migrations.php sync-db.bat sync-db.sh test-db-connection.bat
            echo "✅ Unnecessary files removed."
            
            # Instalar dependencias
            composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist
            
            # Asegurar permisos correctos
            chmod -R 775 storage bootstrap/cache
            
            # PREPARAR CARPETA BUILD PARA SCP
            # No necesitamos crear la carpeta build vacía porque el tar la creará al descomprimir
            # Pero aseguramos que public exista
            mkdir -p public
            
            # Manejo de public_html vs public (Hostinger)
            # Solo aseguramos que el symlink exista, sin hacer backups innecesarios
            if [ ! -d "public_html" ]; then
               ln -s public public_html
            fi
            
            # Limpiar cachés antiguos primero
            php artisan optimize:clear
            
            # Eliminar migraciones antiguas y obsoletas
            echo "Limpiando migraciones obsoletas..."
            rm -f database/migrations/2024_*.php
            rm -f database/migrations/0001_01_01_*.php
            rm -f database/migrations/agregar_*.php
            echo "✅ Migraciones obsoletas eliminadas."
            
            # Sincronizar tabla migrations (solo se ejecuta si el script existe)
            if [ -f "sync_migrations.php" ]; then
              echo "🔄 Sincronizando tabla migrations con tablas existentes..."
              php sync_migrations.php
              # Eliminar el script después de ejecutarlo para que no se ejecute de nuevo
              rm sync_migrations.php
              echo "✅ Sincronización completada y script eliminado."
            fi
            
            # Ejecutar migraciones solo si hay pendientes
            echo "Checking migration status..."
            PENDING=$(php artisan migrate:status --pending 2>/dev/null | grep -c "Pending" || echo "0")
            
            if [ "$PENDING" != "0" ]; then
              echo "Found $PENDING pending migrations, running them..."
              php artisan migrate --force
            else
              echo "No pending migrations found."
            fi

      - name: Copy assets to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "assets.tar.gz"
          target: "${{ secrets.DEPLOY_PATH }}"
          rm: false

      - name: Finalize Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # DESCOMPRIMIR ASSETS
            echo "Extracting assets..."
            tar -xzf assets.tar.gz -C public
            rm assets.tar.gz
            
            # ARREGLAR PERMISOS DE ESTILOS (IMPORTANTE)
            echo "Fixing permissions for build assets..."
            chmod -R 755 public/build
            
            # Limpiar cachés después de migraciones
            php artisan optimize:clear
            
            # Optimizaciones
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Desactivar modo mantenimiento
            php artisan up
            
            echo "✅ Deployment completed successfully!"
            
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production was successful!"
          else
            echo "❌ Deployment failed. Check the logs above."
          fi
