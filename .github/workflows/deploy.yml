name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a main
  workflow_dispatch:  # También permite ejecución manual desde GitHub

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          tools: composer:v2
          coverage: none
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist
        
      - name: Install NPM dependencies
        run: npm ci
        
      - name: Build assets
        run: npm run build

      - name: Copy assets to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/*"
          target: "${{ secrets.DEPLOY_PATH }}/public/build/"
          strip_components: 2
          rm: true
        
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Verificar si es un repo git, si no, inicializarlo (para la primera vez)
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --soft origin/main
            fi
            
            # Activar modo mantenimiento
            php artisan down --retry=60 || true
            
            # Hacer backup de carpetas con contenido del usuario (no versionadas)
            if [ -d "public/fotos" ]; then
              echo "Backing up public/fotos..."
              cp -r public/fotos /tmp/fotos_backup_$$
            fi
            
            # Actualizar código
            git fetch origin main
            git reset --hard origin/main
            
            # Restaurar carpetas con contenido del usuario
            if [ -d "/tmp/fotos_backup_$$" ]; then
              echo "Restoring public/fotos..."
              mkdir -p public
              cp -r /tmp/fotos_backup_$$ public/fotos
              rm -rf /tmp/fotos_backup_$$
            fi
            
            # Instalar dependencias
            composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist
            
            # Asegurar permisos correctos
            chmod -R 775 storage bootstrap/cache
            
            # Manejo de public_html vs public (Hostinger)
            if [ -d "public_html" ] && [ ! -L "public_html" ]; then
               # Si public_html es una carpeta real y no un symlink, hacer backup y crear symlink
               echo "Backing up public_html and creating symlink..."
               mv public_html public_html_backup_$(date +%F_%T)
               ln -s public public_html
            elif [ ! -d "public_html" ]; then
               ln -s public public_html
            fi
            
            # Limpiar cachés antiguos primero
            php artisan optimize:clear
            
            # Eliminar migraciones antiguas y obsoletas
            echo "Limpiando migraciones obsoletas..."
            rm -f database/migrations/2024_*.php
            rm -f database/migrations/0001_01_01_*.php
            rm -f database/migrations/agregar_*.php
            echo "✅ Migraciones obsoletas eliminadas."
            
            # Sincronizar tabla migrations (solo se ejecuta si el script existe)
            if [ -f "sync_migrations.php" ]; then
              echo "🔄 Sincronizando tabla migrations con tablas existentes..."
              php sync_migrations.php
              # Eliminar el script después de ejecutarlo para que no se ejecute de nuevo
              rm sync_migrations.php
              echo "✅ Sincronización completada y script eliminado."
            fi
            
            # Ejecutar migraciones solo si hay pendientes
            echo "Checking migration status..."
            PENDING=$(php artisan migrate:status --pending 2>/dev/null | grep -c "Pending" || echo "0")
            
            if [ "$PENDING" != "0" ]; then
              echo "Found $PENDING pending migrations, running them..."
              php artisan migrate --force
            else
              echo "No pending migrations found."
            fi
            
            # Limpiar cachés después de migraciones
            php artisan optimize:clear
            
            # Optimizaciones
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Desactivar modo mantenimiento
            php artisan up
            
            echo "✅ Deployment completed successfully!"
            
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production was successful!"
          else
            echo "❌ Deployment failed. Check the logs above."
          fi
